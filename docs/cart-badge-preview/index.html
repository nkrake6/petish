<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Petish · Yellow cart badge preview</title>
  <style>
    @font-face { font-family: "DM Sans"; src: url("assets/dm-sans-400-latin.woff2") format("woff2"); font-style: normal; font-weight: 400 700; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8f9fc; color: #14213d; font: 400 15px/1.6 "DM Sans", system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 8px; font-size: 25px; line-height: 1.3; }
    p { margin: 0 0 24px; color: #526077; }
    h2 { margin: 24px 0 10px; font-size: 13px; font-weight: 600; }
    .sample { width: 360px; max-width: 100%; height: 112px; display: flex; align-items: flex-start; padding: 22px 24px 0; border-bottom: 1px solid var(--line); background: var(--surface); color: var(--text); }
    .dark { --surface: #16243b; --text: #f7f8fc; --active: #20c6f7; --line: #2b3b55; }
    .light { --surface: #fff; --text: #14213d; --active: #0f4c5c; --line: #e3e7ef; }
    .links { display: flex; align-items: flex-start; gap: 30px; height: 36px; }
    .link { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 0 10px; font-size: 14px; line-height: 24px; font-weight: 600; white-space: nowrap; }
    .current { color: var(--active); border-bottom: 2px solid var(--active); }
    .badge { display: inline-flex; flex: 0 0 24px; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: #f9a825; color: #0b1426; font: 700 12px/1 "DM Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .note { margin-top: 24px; max-width: 55ch; font-size: 13px; }
    @media(max-width:400px) { main { padding-inline: 12px; } .sample { padding-inline: 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>Yellow cart badge</h1>
    <p>A warm yellow circle with a dark number beside Cart.</p>
    <h2>Dark mode</h2>
    <div class="sample dark" id="dark-preview" aria-label="Dark navigation preview: Cart has three items">
      <div class="links"><span class="link current">My account</span><span class="link">Cart <span class="badge" aria-hidden="true">3</span></span></div>
    </div>
    <h2>Light mode</h2>
    <div class="sample light" id="light-preview" aria-label="Light navigation preview: Cart has three items">
      <div class="links"><span class="link current">My account</span><span class="link">Cart <span class="badge" aria-hidden="true">3</span></span></div>
    </div>
    <p class="note">Design preview only. The number shown is an example; this preview does not connect to a cart or change the live store.</p>
  </main>
</body>
</html>
