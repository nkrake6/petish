name: Inspect one order privately without changing it

on:
  push:
    branches: [prepare-order-refund-inspection, inspect-order-refund]

permissions:
  contents: write

concurrency:
  group: petish-production-backup-mail
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'nkrake6/petish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
    steps:
      - name: Check out exact reviewed private inspection tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Prepare pinned SSH and encryption tools
        id: prepare
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          bash scripts/hostinger-connection-check.sh
          python3 -m pip install --disable-pip-version-check --no-input cryptography==50.0.0
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
      - name: Prepare a one-use key or collect an encrypted read-only report
        if: always()
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          ORDER_REFUND_PREREQUISITES: ${{ steps.prepare.outcome }}
        run: bash scripts/hostinger-order-refund-inspection.sh
      - name: Remove private runner files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/petish-order-refund.*
          rm -f -- "$RUNNER_TEMP/petish-candidate-host-keys" "$RUNNER_TEMP/petish-verified-automation-host-keys"
