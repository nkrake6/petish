name: Back up the full Petish site to Git
# Refresh the recovered backup before the verified header switch and flag release.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Configure Petish order email', 'Deploy verified Petish email branding']
    types: [completed]
    branches: [main, configure-mail, deploy-email-branding]
  push:
    branches:
      - main
    paths:
      - .github/workflows/backup-full-site.yml
      - scripts/backup-wordpress-remote.sh
      - scripts/hostinger-full-backup.sh
      - scripts/verify-full-backup.py
      - scripts/package-encrypted-backup.py
      - scripts/restore-backup-sandbox.sh
      - scripts/test-full-backup-restore.py

permissions:
  contents: write

concurrency:
  group: petish-production-backup-mail
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted full WordPress backup
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'configure-mail' || github.event.workflow_run.head_branch == 'deploy-email-branding') &&
       (github.event.workflow_run.name != 'Deploy verified Petish email branding' || github.event.workflow_run.head_branch == 'deploy-email-branding') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
    steps:
      - name: Check out backup tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: true

      - name: Check the backup passphrase is configured
        env:
          PETISH_BACKUP_PASSPHRASE: ${{ secrets.PETISH_BACKUP_PASSPHRASE }}
        run: |
          set +x
          set -euo pipefail
          if (( ${#PETISH_BACKUP_PASSPHRASE} < 24 )) || [[ "$PETISH_BACKUP_PASSPHRASE" == *$'\n'* || "$PETISH_BACKUP_PASSPHRASE" == *$'\r'* ]]; then
            printf '%s\n' 'Add PETISH_BACKUP_PASSPHRASE as a repository secret: a long, single-line random passphrase (at least 24 characters). Keep a separate copy in your password manager.' >&2
            exit 1
          fi

      - name: Check SSH connectivity without credentials
        run: |
          for attempt in 1 2 3; do
            if bash scripts/hostinger-connection-check.sh; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 2
          done

      - name: Prepare encryption and SSH tools on the GitHub runner
        run: |
          if ! command -v sshpass >/dev/null 2>&1 || ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass gnupg
          fi

      - name: Stream and encrypt the complete site backup
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          PETISH_BACKUP_PASSPHRASE: ${{ secrets.PETISH_BACKUP_PASSPHRASE }}
        run: |
          set +x
          set -euo pipefail
          for attempt in 1 2 3; do
            task_status=0
            bash scripts/hostinger-full-backup.sh > "$RUNNER_TEMP/petish-task.stdout" 2> "$RUNNER_TEMP/petish-task.stderr" || task_status=$?
            python3 scripts/record-task-result.py backup-export "$task_status" "$RUNNER_TEMP/petish-task.stdout" "$RUNNER_TEMP/petish-task.stderr" "$RUNNER_TEMP/petish-task-diagnostics.json"
            cat "$RUNNER_TEMP/petish-task-diagnostics.json"
            if [[ "$task_status" == 0 || "$attempt" == 3 ]]; then break; fi
            if ! python3 - "$RUNNER_TEMP/petish-task-diagnostics.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          raise SystemExit(0 if 'archive_changed' in report.get('categories',[]) else 1)
          PY
            then break; fi
            if command -v gpgconf >/dev/null 2>&1 && [[ -d "$RUNNER_TEMP/petish-full-backup/gnupg" ]]; then
              gpgconf --homedir "$RUNNER_TEMP/petish-full-backup/gnupg" --kill gpg-agent || true
            fi
            rm -rf -- "$RUNNER_TEMP/petish-full-backup"
            sleep 2
          done
          exit "$task_status"

      - name: Commit only encrypted backup parts to a new branch
        env:
          BACKUP_BRANCH: full-site-backup/${{ github.run_id }}-${{ github.run_attempt }}
          BACKUP_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          backup_destination="site-backups/$BACKUP_ID"
          if [[ -e "$backup_destination" || -L site-backups ]]; then
            printf '%s\n' 'Refusing to overwrite an existing backup destination.' >&2
            exit 1
          fi
          mkdir -p "$backup_destination"
          cp -a "$RUNNER_TEMP/petish-full-backup/publish/." "$backup_destination/"
          git switch -c "$BACKUP_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$backup_destination"
          git commit -m "Encrypted full Petish site backup $BACKUP_ID"
          git push origin "$BACKUP_BRANCH"
          {
            printf '## Full site backup stored in Git\n\n'
            printf 'Full website files and database were encrypted, decrypted for a streaming integrity check, and committed as ordered encrypted parts. The live site was not deployed or reconfigured.\n\n'
            printf '[Open the backup branch](https://github.com/%s/tree/%s/site-backups/%s)\n\n' "$GITHUB_REPOSITORY" "$BACKUP_BRANCH" "$BACKUP_ID"
            printf 'Branch: `%s`\n\n' "$BACKUP_BRANCH"
            printf 'Keep your backup passphrase in your password manager. GitHub cannot show a stored secret back to you. The backup cannot be restored without it.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore database and files in an isolated disposable sandbox
        env:
          PETISH_BACKUP_PASSPHRASE: ${{ secrets.PETISH_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          bash scripts/restore-backup-sandbox.sh | tee "$RUNNER_TEMP/petish-backup-restore-result.json"

      - name: Publish a nonsecret result for browser-session monitoring
        if: always()
        env:
          AUTOMATION_KIND: backup
          AUTOMATION_RESULT: ${{ job.status }}
        run: bash scripts/publish-automation-status.sh

      - name: Clean up private runner files and encryption agent
        if: always()
        run: |
          docker ps --all --quiet --filter label=org.petish.restore-smoke=true \
            | xargs --no-run-if-empty docker rm --force --volumes >/dev/null \
            || printf '%s\n' 'Disposable database cleanup needs runner teardown.' >&2
          if command -v gpgconf >/dev/null 2>&1 && [[ -d "$RUNNER_TEMP/petish-full-backup/gnupg" ]]; then
            gpgconf --homedir "$RUNNER_TEMP/petish-full-backup/gnupg" --kill gpg-agent || true
          fi
          rm -rf -- "$RUNNER_TEMP/petish-full-backup"
          rm -f -- "$RUNNER_TEMP/petish-candidate-host-keys" "$RUNNER_TEMP/petish-verified-backup-host-keys"
          rm -f -- "$RUNNER_TEMP/petish-backup-restore-result.json"
          rm -f -- "$RUNNER_TEMP/petish-task.stdout" "$RUNNER_TEMP/petish-task.stderr" "$RUNNER_TEMP/petish-task-diagnostics.json"
