name: Inspect or release Petish cancellations and FAQ

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect production or apply the staging-proven bounded release
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]
  push:
    branches: [inspect-cancellation-production, deploy-cancellation-production]

permissions:
  contents: write

concurrency:
  group: petish-production-backup-mail
  cancel-in-progress: false

jobs:
  production:
    if: github.repository == 'nkrake6/petish' && (github.ref_name == 'inspect-cancellation-production' || github.ref_name == 'deploy-cancellation-production')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
      CANCELLATION_PRODUCTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.ref_name == 'deploy-cancellation-production' && 'apply' || 'inspect') }}
    steps:
      - name: Check out the exact reviewed release tools and source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Prepare pinned SSH and public health dependencies
        id: prepare
        continue-on-error: true
        run: |
          preparation_stage=connection
          trap 'printf "stage=%s\n" "$preparation_stage" >> "$GITHUB_OUTPUT"' EXIT
          for attempt in 1 2 3; do
            if bash scripts/hostinger-connection-check.sh; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 2
          done
          preparation_stage=ssh_tools
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
          if [[ "$CANCELLATION_PRODUCTION_MODE" == apply ]]; then
            preparation_stage=health_dependencies
            python3 -m pip install --disable-pip-version-check --no-input Pillow==12.0.0
          fi
          preparation_stage=complete
      - name: Inspect or apply only the verified cancellation scope
        if: always()
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          CANCELLATION_PRODUCTION_PREREQUISITES: ${{ steps.prepare.outcome }}
          CANCELLATION_PRODUCTION_PREPARATION_STAGE: ${{ steps.prepare.outputs.stage }}
        run: bash scripts/hostinger-cancellation-production.sh
      - name: Remove private runner files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/petish-cancellation-production.*
          rm -f -- "$RUNNER_TEMP/petish-candidate-host-keys" "$RUNNER_TEMP/petish-verified-automation-host-keys"
