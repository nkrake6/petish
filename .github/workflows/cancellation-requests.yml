name: Prepare or verify Petish cancellation requests on private staging

on:
  workflow_dispatch:
  push:
    branches: [prepare-cancellation-requests, verify-cancellation-requests]

permissions:
  contents: write

concurrency:
  group: petish-staging-code
  cancel-in-progress: false

jobs:
  private-staging:
    if: github.repository == 'nkrake6/petish' && (github.ref_name == 'verify-cancellation-requests' || github.ref_name == 'prepare-cancellation-requests')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
    steps:
      - name: Check out the exact source revision being verified
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Prepare pinned SSH connection
        id: prepare
        continue-on-error: true
        run: |
          preparation_stage=connection
          trap 'printf "stage=%s\n" "$preparation_stage" >> "$GITHUB_OUTPUT"' EXIT
          umask 077
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 15 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$RUNNER_TEMP/petish-candidate-host-keys" 2>/dev/null && test -s "$RUNNER_TEMP/petish-candidate-host-keys"; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 5
          done
          preparation_stage=ssh_tools
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
          preparation_stage=complete
      - name: Append FAQs to the existing staging delivery page, or verify cancellation controls
        if: always()
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          CANCELLATION_REQUESTS_PREREQUISITES: ${{ steps.prepare.outcome }}
          CANCELLATION_REQUESTS_PREPARATION_STAGE: ${{ steps.prepare.outputs.stage }}
        run: bash scripts/hostinger-cancellation-requests.sh
      - name: Remove private runner data
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/petish-cancellation-requests.*
          rm -f -- "$RUNNER_TEMP/petish-candidate-host-keys" "$RUNNER_TEMP/petish-verified-automation-host-keys"
