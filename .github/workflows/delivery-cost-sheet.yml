name: Verify and release Petish delivery cost sheet

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify private staging, inspect production, or apply the verified admin tool
        required: true
        default: staging
        type: choice
        options: [staging, inspect, apply]
  push:
    branches: [main, verify-delivery-cost-sheet, deploy-delivery-cost-sheet]
    paths:
      - .github/workflows/delivery-cost-sheet.yml
      - scripts/hostinger-delivery-cost-sheet.sh
      - scripts/deploy-delivery-cost-sheet-remote.php
      - scripts/verify-delivery-cost-sheet.php
      - scripts/sanitize-delivery-cost-sheet-result.py
      - scripts/validate-delivery-cost-sheet-release.py
      - operations/delivery-cost-sheet-release.json
      - wordpress/wp-content/plugins/petish-fulfilment/petish-fulfilment.php
      - wordpress/wp-content/plugins/petish-fulfilment/includes/class-petish-delivery-cost-sheet.php
      - wordpress/wp-content/plugins/petish-fulfilment/includes/class-petish-delivery-cost-sheet-admin.php

permissions:
  contents: write

concurrency:
  group: ${{ (inputs.mode == 'staging' || github.ref_name == 'verify-delivery-cost-sheet') && 'petish-staging-code' || ((github.ref_name == 'deploy-delivery-cost-sheet' || inputs.mode == 'apply') && 'petish-production-backup-mail' || format('petish-delivery-cost-sheet-inspection-{0}', github.run_id)) }}
  cancel-in-progress: false

jobs:
  cost-sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
      DELIVERY_COST_SHEET_MODE: ${{ (github.ref_name == 'verify-delivery-cost-sheet') && 'staging' || (github.event_name == 'workflow_dispatch' && inputs.mode || (github.ref_name == 'deploy-delivery-cost-sheet' && 'apply' || 'inspect')) }}
      DELIVERY_COST_SHEET_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out reviewed delivery cost-sheet tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: true
      - name: Prepare pinned SSH connection and public health dependencies
        id: prepare
        continue-on-error: true
        run: |
          preparation_stage=connection
          trap 'printf "stage=%s\n" "$preparation_stage" >> "$GITHUB_OUTPUT"' EXIT
          for attempt in 1 2 3; do
            if bash scripts/hostinger-connection-check.sh; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 2
          done
          preparation_stage=ssh_tools
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
          if [[ "$DELIVERY_COST_SHEET_MODE" == apply ]]; then
            preparation_stage=health_dependencies
            for attempt in 1 2 3; do
              if python3 -m pip install --disable-pip-version-check --no-input Pillow==12.0.0; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
          preparation_stage=complete
      - name: Verify staging or inspect and release the private cost-sheet tool
        if: always()
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          DELIVERY_COST_SHEET_PREREQUISITES: ${{ steps.prepare.outcome }}
          DELIVERY_COST_SHEET_PREPARATION_STAGE: ${{ steps.prepare.outputs.stage }}
        run: bash scripts/hostinger-delivery-cost-sheet.sh
      - name: Remove private runner data
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/petish-delivery-cost-sheet.*
          rm -f -- "$RUNNER_TEMP/petish-candidate-host-keys" "$RUNNER_TEMP/petish-verified-automation-host-keys"
