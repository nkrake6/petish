name: Inspect and release Petish customer reviews

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect production or release the verified customer review feature
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]
  push:
    branches: [main, deploy-customer-reviews]

permissions:
  contents: write

concurrency:
  group: petish-production-backup-mail
  cancel-in-progress: false

jobs:
  reviews:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
      CUSTOMER_REVIEWS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.ref_name == 'deploy-customer-reviews' && 'apply' || 'inspect') }}
    steps:
      - name: Check out the exact reviewed release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Prepare existing SSH tooling
        id: prepare
        continue-on-error: true
        run: |
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
      - name: Inspect or release the verified customer review feature
        if: always()
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          CUSTOMER_REVIEWS_PREREQUISITES: ${{ steps.prepare.outcome }}
        run: bash scripts/hostinger-customer-reviews-production.sh
      - name: Remove private runner material
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/petish-customer-reviews-production.*
          rm -f -- "$RUNNER_TEMP/petish-candidate-host-keys" "$RUNNER_TEMP/petish-verified-automation-host-keys"
