name: Inspect or update the Petish delivery page
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect, rehearse a rolled-back update, or apply an exactly rehearsed revision
        required: true
        default: inspect
        type: choice
        options: [inspect, rehearse, apply]
  push:
    # These branches explicitly request an operation. A rehearsed SHA may already
    # exist remotely when the deploy branch is created, leaving no path diff.
    branches: [inspect-delivery-page, rehearse-delivery-page, deploy-delivery-page]
permissions:
  contents: write
concurrency:
  group: petish-production-backup-mail
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
      DELIVERY_PAGE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.ref_name == 'deploy-delivery-page' && 'apply' || (github.ref_name == 'rehearse-delivery-page' && 'rehearse' || 'inspect')) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Prepare pinned SSH connection
        id: prepare
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if bash scripts/hostinger-connection-check.sh; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 2
          done
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
      - name: Run the fixed delivery-page operation
        if: always()
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          DELIVERY_PAGE_PREREQUISITES: ${{ steps.prepare.outcome }}
        run: bash scripts/hostinger-delivery-page.sh
