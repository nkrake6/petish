name: Verify and release Petish homepage and header

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify staging, inspect production, or apply the verified homepage and header files
        required: true
        default: staging
        type: choice
        options: [staging, inspect, apply]
  push:
    # Install matching application bytes via the staging branch before verification.
    # Main inspects; verify-homepage proves native Cart changes; deploy-homepage applies.
    branches: [main, verify-homepage, deploy-homepage]
    paths:
      - .github/workflows/homepage.yml
      - scripts/hostinger-homepage.sh
      - scripts/homepage-browser-container.sh
      - scripts/deploy-homepage-remote.php
      - scripts/verify-homepage.php
      - scripts/for-your-pet-proof.php
      - scripts/cart-badge-staging-proof.php
      - scripts/verify-pet-club.php
      - scripts/verify-homepage-assets.py
      - scripts/sanitize-homepage-result.py
      - scripts/validate-homepage-release.py
      - scripts/litespeed-html-purge.php
      - scripts/consume-litespeed-html-purge.py
      - scripts/sanitize-litespeed-html-purge.py
      - tools/homepage/browser.mjs
      - tools/homepage/container-smoke.mjs
      - tools/homepage/cart-badge-browser.mjs
      - operations/homepage-release.json
      - wordpress/wp-content/themes/dt-the7-child/front-page.php
      - wordpress/wp-content/themes/dt-the7-child/functions.php
      - wordpress/wp-content/themes/dt-the7-child/includes/for-your-pet.php
      - wordpress/wp-content/themes/dt-the7-child/assets/js/for-your-pet.js
      - wordpress/wp-content/themes/dt-the7-child/includes/supplier-popularity.php
      - wordpress/wp-content/themes/dt-the7-child/assets/css/home.css
      - wordpress/wp-content/themes/dt-the7-child/assets/images/ui/free-delivery-van.png
      - wordpress/wp-content/themes/dt-the7-child/includes/cart-badge.php
      - wordpress/wp-content/themes/dt-the7-child/assets/css/cart-badge.css
      - wordpress/wp-content/themes/dt-the7-child/assets/js/cart-badge.js
      - wordpress/wp-content/themes/dt-the7-child/includes/header-navigation.php
      - wordpress/wp-content/themes/dt-the7-child/assets/js/theme.js
      - wordpress/wp-content/themes/dt-the7-child/assets/css/petish.css
      - wordpress/wp-content/themes/dt-the7-child/includes/market-selector.php
      - wordpress/wp-content/themes/dt-the7-child/assets/js/market-selector.js
      - wordpress/wp-content/themes/dt-the7-child/assets/css/market-selector.css
      - wordpress/wp-content/themes/dt-the7-child/assets/images/ui/country-flags.svg
      - wordpress/wp-content/themes/dt-the7-child/assets/images/ui/country-flags.LICENSE.txt
      - wordpress/wp-content/themes/dt-the7-child/includes/account-dropdown.php
      - wordpress/wp-content/themes/dt-the7-child/assets/css/account-dropdown.css
      - wordpress/wp-content/themes/dt-the7-child/assets/js/account-dropdown.js
      - wordpress/wp-content/themes/dt-the7-child/includes/hero-images.php
      - wordpress/wp-content/themes/dt-the7-child/assets/js/hero-images-admin.js

permissions:
  contents: write

concurrency:
  group: ${{ (inputs.mode == 'staging' || github.ref_name == 'verify-homepage') && 'petish-staging-code' || ((github.ref_name == 'deploy-homepage' || inputs.mode == 'apply') && 'petish-production-backup-mail' || format('petish-homepage-inspection-{0}', github.run_id)) }}
  cancel-in-progress: false

jobs:
  homepage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
      HOMEPAGE_MODE: ${{ (github.ref_name == 'verify-homepage') && 'staging' || (github.event_name == 'workflow_dispatch' && inputs.mode || (github.ref_name == 'deploy-homepage' && 'apply' || 'inspect')) }}
      HOMEPAGE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out reviewed homepage tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Prepare pinned SSH connection and verification tools
        id: prepare
        timeout-minutes: 8
        continue-on-error: true
        run: |
          preparation_stage=connection
          trap 'printf "stage=%s\n" "$preparation_stage" >> "$GITHUB_OUTPUT"' EXIT
          umask 077
          for attempt in 1 2 3 4 5 6; do
            # Use the same discovery as the successful backup/release jobs.
            # The shared helper retains only the exact independently pinned key
            # before authentication; other presented keys are never trusted.
            if ssh-keyscan -T 15 -p "$SSH_PORT" -t ed25519,ecdsa,rsa "$SSH_HOST" > "$RUNNER_TEMP/petish-candidate-host-keys" 2>/dev/null \
                && [[ -s "$RUNNER_TEMP/petish-candidate-host-keys" ]]; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 5
          done
          preparation_stage=ssh_tools
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
          if [[ "$HOMEPAGE_MODE" == staging ]]; then
            preparation_stage=npm_tools
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 timeout --kill-after=5s 90s npm ci --prefix tools/staging-rehearsal --no-audit --no-fund
            preparation_stage=browser_tools
            browser_image=$(bash scripts/homepage-browser-container.sh prepare)
            printf 'PETISH_HOMEPAGE_BROWSER_IMAGE=%s\n' "$browser_image" >> "$GITHUB_ENV"
          fi
          if [[ "$HOMEPAGE_MODE" == apply ]]; then
            preparation_stage=health_dependencies
            for attempt in 1 2 3; do
              if python3 -m pip install --disable-pip-version-check --no-input Pillow==12.0.0; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
          preparation_stage=complete
      - name: Verify staging or inspect and release the homepage
        if: always()
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          HOMEPAGE_PREREQUISITES: ${{ steps.prepare.outcome }}
          HOMEPAGE_PREPARATION_STAGE: ${{ steps.prepare.outputs.stage }}
        run: bash scripts/hostinger-homepage.sh
      - name: Remove private runner data
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/petish-homepage.* "$RUNNER_TEMP"/petish-homepage-container.* "$RUNNER_TEMP/petish-homepage-browsers"
          rm -f -- "$RUNNER_TEMP/petish-candidate-host-keys" "$RUNNER_TEMP/petish-verified-automation-host-keys"

