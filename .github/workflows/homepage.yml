name: Verify and release Petish homepage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify staging, inspect production, or apply the verified homepage files
        required: true
        default: staging
        type: choice
        options: [staging, inspect, apply]
  push:
    # Main inspects; verify-homepage rehearses; the release branch applies reviewed candidates.
    branches: [main, verify-homepage, deploy-homepage]
    paths:
      - .github/workflows/homepage.yml
      - scripts/hostinger-homepage.sh
      - scripts/deploy-homepage-remote.php
      - scripts/verify-homepage.php
      - scripts/for-your-pet-proof.php
      - scripts/verify-pet-club.php
      - scripts/verify-homepage-assets.py
      - scripts/sanitize-homepage-result.py
      - scripts/validate-homepage-release.py
      - tools/homepage/browser.mjs
      - operations/homepage-release.json
      - wordpress/wp-content/themes/dt-the7-child/front-page.php
      - wordpress/wp-content/themes/dt-the7-child/functions.php
      - wordpress/wp-content/themes/dt-the7-child/includes/for-your-pet.php
      - wordpress/wp-content/themes/dt-the7-child/assets/js/for-your-pet.js
      - wordpress/wp-content/themes/dt-the7-child/includes/supplier-popularity.php
      - wordpress/wp-content/themes/dt-the7-child/assets/css/home.css
      - wordpress/wp-content/themes/dt-the7-child/assets/images/ui/free-delivery-van.png

permissions:
  contents: write

concurrency:
  group: ${{ (inputs.mode == 'staging' || github.ref_name == 'verify-homepage') && 'petish-staging-code' || ((github.ref_name == 'deploy-homepage' || inputs.mode == 'apply') && 'petish-production-backup-mail' || format('petish-homepage-inspection-{0}', github.run_id)) }}
  cancel-in-progress: false

jobs:
  homepage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
      HOMEPAGE_MODE: ${{ (github.ref_name == 'verify-homepage') && 'staging' || (github.event_name == 'workflow_dispatch' && inputs.mode || (github.ref_name == 'deploy-homepage' && 'apply' || 'inspect')) }}
      HOMEPAGE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out reviewed homepage tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Prepare pinned SSH connection and verification tools
        id: prepare
        continue-on-error: true
        run: |
          preparation_stage=connection
          trap 'printf "stage=%s\n" "$preparation_stage" >> "$GITHUB_OUTPUT"' EXIT
          for attempt in 1 2 3; do
            if bash scripts/hostinger-connection-check.sh; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          preparation_stage=ssh_tools
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
          if [[ "$HOMEPAGE_MODE" == staging ]]; then
            preparation_stage=browser_tools
            export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/petish-homepage-browsers"
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
            npm ci --prefix tools/staging-rehearsal --no-audit --no-fund
            node tools/staging-rehearsal/node_modules/playwright/cli.js install --with-deps chromium
          fi
          if [[ "$HOMEPAGE_MODE" == apply ]]; then
            preparation_stage=health_dependencies
            for attempt in 1 2 3; do
              if python3 -m pip install --disable-pip-version-check --no-input Pillow==12.0.0; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
          preparation_stage=complete
      - name: Verify staging or inspect and release the homepage
        if: always()
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          HOMEPAGE_PREREQUISITES: ${{ steps.prepare.outcome }}
          HOMEPAGE_PREPARATION_STAGE: ${{ steps.prepare.outputs.stage }}
        run: bash scripts/hostinger-homepage.sh
      - name: Remove private runner data
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/petish-homepage.* "$RUNNER_TEMP/petish-homepage-browsers"
          rm -f -- "$RUNNER_TEMP/petish-candidate-host-keys" "$RUNNER_TEMP/petish-verified-automation-host-keys"

