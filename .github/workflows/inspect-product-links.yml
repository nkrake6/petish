name: Resolve five Petish product links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-product-links.yml
      - scripts/inspect-product-links-remote.sh

permissions:
  contents: write

concurrency:
  group: petish-product-links
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
    steps:
      - name: Check out reviewed scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: true
      - name: Check connectivity and prepare SSH helper
        id: prepare
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          bash scripts/hostinger-connection-check.sh
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi
      - name: Read the five published product links
        id: lookup
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          source scripts/hostinger-ssh-common.sh
          petish_prepare_ssh
          "${petish_ssh[@]}" 'bash -s' < scripts/inspect-product-links-remote.sh \
            > "$RUNNER_TEMP/petish-product-links-private.json" \
            2> "$RUNNER_TEMP/petish-product-links-private.stderr"
      - name: Validate only public product URLs
        id: validate
        if: steps.lookup.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.parse import urlsplit
          try:
              path = Path(os.environ['RUNNER_TEMP']) / 'petish-product-links-private.json'
              if path.stat().st_size > 8192:
                  raise ValueError()
              rows = json.loads(path.read_text())
              if not isinstance(rows, list) or len(rows) != 5:
                  raise ValueError()
              ids = []
              for row in rows:
                  if not isinstance(row, dict) or set(row) != {'variation_id', 'url'} or type(row['variation_id']) is not int or not isinstance(row['url'], str):
                      raise ValueError()
                  parsed = urlsplit(row['url'])
                  if parsed.scheme != 'https' or parsed.netloc != 'petish.biz' or parsed.query or parsed.fragment or not re.fullmatch(r'/product/[a-z0-9]+(?:-[a-z0-9]+)*/', parsed.path) or len(parsed.path) > 210:
                      raise ValueError()
                  ids.append(row['variation_id'])
              if sorted(ids) != [153, 246, 858, 1546, 2137]:
                  raise ValueError()
              output = Path(os.environ['RUNNER_TEMP']) / 'petish-product-links-public.json'
              output.write_text(json.dumps({'status': 'success', 'products': rows}, indent=2) + '\n')
          except (OSError, ValueError, TypeError, KeyError):
              raise SystemExit('Public product link validation failed.')
          PY
      - name: Publish public links or a static unavailable status
        if: always()
        env:
          PREPARE_RESULT: ${{ steps.prepare.outcome }}
          LOOKUP_RESULT: ${{ steps.lookup.outcome }}
          VALIDATE_RESULT: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'petish-product-links-public.json'
          if os.environ['VALIDATE_RESULT'] != 'success':
              category = 'connection_unavailable' if os.environ['PREPARE_RESULT'] != 'success' else ('product_lookup_unavailable' if os.environ['LOOKUP_RESULT'] != 'success' else 'link_validation_failed')
              path.write_text(json.dumps({'status': 'unavailable', 'category': category}, indent=2) + '\n')
          PY
          [[ "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+-[0-9]+$ ]]
          blob=$(git hash-object -w "$RUNNER_TEMP/petish-product-links-public.json")
          tree=$(printf '100644 blob %s\tproduct-links.json\n' "$blob" | git mktree)
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf 'Read-only Petish product links\n' | git commit-tree "$tree")
          report_branch="catalogue-links/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "$commit:refs/heads/$report_branch"
          printf '[Public product link report](https://github.com/%s/blob/%s/product-links.json)\n' "$GITHUB_REPOSITORY" "$report_branch" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private runner output
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/petish-product-links-private.json" "$RUNNER_TEMP/petish-product-links-private.stderr" \
            "$RUNNER_TEMP/petish-product-links-public.json" "$RUNNER_TEMP/petish-verified-automation-host-keys" "$RUNNER_TEMP/petish-candidate-host-keys"
