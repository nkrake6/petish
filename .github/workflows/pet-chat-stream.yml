name: Enable channel chat on private staging
on:
  push:
    branches: [verify-pet-chat-stream]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: petish-staging-code
  cancel-in-progress: false
jobs:
  enable:
    if: github.repository == 'nkrake6/petish' && github.ref_name == 'verify-pet-chat-stream'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SSH_HOST: 82.29.81.104
      SSH_PORT: '65002'
      SSH_USER: u839205597
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify connection and existing pinned SSH identity
        run: |
          bash scripts/hostinger-connection-check.sh
          if ! command -v sshpass >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends sshpass
          fi
      - name: Provision only channel storage, preserve history and enable staging
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_EXPECTED_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
        run: bash scripts/hostinger-pet-chat-stream.sh
      - name: Retain finite nonsecret checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pet-chat-stream-staging-checks
          path: ${{ runner.temp }}/pet-chat-stream-result.json
          if-no-files-found: ignore
          retention-days: 7
